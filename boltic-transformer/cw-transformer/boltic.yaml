app: "cw-transformer"
region: "asia-south1"
handler: "handler.handler"
language: "python/3"

serverlessConfig:
  serverlessId: "e6e056dc-a3ab-4e45-9182-8054a919427e"
  Name: "cw-transformer"
  Description: "Cottonworld Logic ERP to Fynd Catalog transformer"
  Runtime: "code"
  # Fynd private-extension config. Set the SECRET values in the Boltic dashboard
  # (do not commit real keys here). EXTENSION_BASE_URL must equal this function's
  # public URL and match the Extension URL in the Fynd Partner panel exactly.
  Env:
    FP_API_DOMAIN: "https://api.fynd.com"
    EXTENSION_SCOPE: ""
    # EXTENSION_API_KEY:    <set in Boltic dashboard>
    # EXTENSION_API_SECRET: <set in Boltic dashboard>
    # EXTENSION_BASE_URL:   <set in Boltic dashboard, e.g. https://<fn>.boltic.app>
  PortMap: []
  Scaling:
    AutoStop: true
    # Keep one warm instance so the short OAuth install handshake reliably hits
    # the same instance (the signed-cookie state is stateless, but this avoids
    # cold-start latency mid-install).
    Min: 1
    Max: 5
    MaxIdleTime: 300
  Resources:
    CPU: 0.5
    MemoryMB: 512
    MemoryMaxMB: 1024
  Timeout: 60
  Validations: null

build:
  builtin: dockerfile
  ignorefile: .gitignore
